name: Daily Cleanup Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: cleanup-bot
  cancel-in-progress: true

jobs:
  run-cleaner:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install discord.py

      - name: Run cleaner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python cleaner_bot.py
